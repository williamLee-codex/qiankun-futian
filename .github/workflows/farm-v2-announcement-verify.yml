name: Farm V2 announcement verification
on:
  pull_request:
    paths:
      - 'artifacts/qiankun-farm/src/game/v2/FarmV2AnnouncementOverlay.tsx'
      - 'artifacts/qiankun-farm/src/main.tsx'
      - '.github/workflows/farm-v2-announcement-verify.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck Farm V2
        run: pnpm --filter @workspace/qiankun-farm typecheck
      - name: Build Farm V2
        run: pnpm --filter @workspace/qiankun-farm build
