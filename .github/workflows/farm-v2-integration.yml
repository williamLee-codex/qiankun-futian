name: Farm V2 integration
on:
  workflow_dispatch: {}
  push:
    branches:
      - "integrate/farm-v2-firstpurchase-signin-20261122"
      - "verify/farm-v2-tsc-10pct-20261125"
      - "release/farm-v2-tsc-20261124"
    paths:
      - "artifacts/api-server/src/lib/**"
      - "lib/db/migrations/**"
      - "scripts/dev/**"
      - "artifacts/api-server/scripts/dev/**"
      - ".github/workflows/farm-v2-integration.yml"
  pull_request:
    paths:
      - "artifacts/api-server/src/lib/**"
      - "lib/db/migrations/**"
      - "scripts/dev/**"
      - "artifacts/api-server/scripts/dev/**"
      - ".github/workflows/farm-v2-integration.yml"
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: farm-v2-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d farm_v2_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:farm-v2-test@127.0.0.1:5432/farm_v2_test
      FARM_V2_TEST_DATABASE_URL: postgres://postgres:farm-v2-test@127.0.0.1:5432/farm_v2_test
      FARM_V2_INIT_TEST_DATABASE_URL: postgres://postgres:farm-v2-test@127.0.0.1:5432/farm_v2_init_disposable
      FARM_V2_PLATFORM_CHECKOUT: ${{ github.workspace }}/artifacts/api-server/scripts/dev/platform-fixtures
      PGPASSWORD: farm-v2-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare Supabase-compatible database
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE farm_v2_test"
          psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE farm_v2_init_disposable"
          psql -h 127.0.0.1 -U postgres -d farm_v2_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS public._harness_applied (file text PRIMARY KEY);
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY);
          ALTER TABLE auth.users ADD COLUMN IF NOT EXISTS banned_until timestamptz;
          ALTER TABLE auth.users ADD COLUMN IF NOT EXISTS deleted_at timestamptz;
          CREATE TABLE IF NOT EXISTS public.launch_tokens (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id uuid, app_id text, token_hash text UNIQUE,
            expires_at timestamptz, used_at timestamptz, revoked_at timestamptz
          );
          CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY, email text);
          -- Supabase's auth helpers, same definition the hosted platform uses.
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$
            SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS $$
            SELECT nullif(current_setting('request.jwt.claim.role', true), '')
          $$;
          DO $$ BEGIN CREATE ROLE anon NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE authenticated NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE service_role NOLOGIN BYPASSRLS; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $ BEGIN CREATE ROLE farm_v2_runtime LOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $;
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          SQL
      - name: Apply the canonical baseline
        run: |
          # The baseline is the only place the core schema is created.
          for f in artifacts/api-server/scripts/dev/platform-fixtures/supabase/baseline/dev-canonical-0001-0010/0*.sql; do
            echo "== $(basename "$f")"
            psql -h 127.0.0.1 -U postgres -d farm_v2_test -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Create the platform friendships table
        run: |
          psql -h 127.0.0.1 -U postgres -d farm_v2_test -v ON_ERROR_STOP=1 -q \
            -f artifacts/api-server/scripts/dev/platform-friendships-extract.sql
          psql -h 127.0.0.1 -U postgres -d farm_v2_test -q -c \
            "INSERT INTO public._harness_applied(file) VALUES ('platform-friendships-extract.sql') ON CONFLICT DO NOTHING;"
      - name: Apply the farm migration chain
        run: |
          # Explicit order, verified against the files. No globs, no repeats.
          for name in \
            0019_create_core_wallet_runtime.sql \
            0123_farm_v2_wallet_bridge.sql \
            0124_farm_v2_sessions.sql \
            0125_farm_v2_paid_auth_identity.sql \
            0126_farm_v2_account_revocation.sql \
            0127_farm_v2_paid_operation_authority.sql \
            0128_farm_v2_operator_reconciliation.sql \
            0129_farm_v2_wallet_creation_and_historical_revocation.sql \
            0130_farm_v2_workshop_wallet_contract.sql \
            0131_farm_v2_friend_operation_barrier.sql \
            0132_farm_v2_atomic_pot_settlement.sql \
            0136_farm_v2_formation_tier_contract.sql \
            0137_farm_v2_crop_reward_label.sql \
          ; do
            f="artifacts/api-server/scripts/dev/platform-fixtures/supabase/migrations/$name"
            echo "== $name"
            psql -h 127.0.0.1 -U postgres -d farm_v2_test -v ON_ERROR_STOP=1 -q -f "$f"
            psql -h 127.0.0.1 -U postgres -d farm_v2_test -q -c \
              "INSERT INTO public._harness_applied(file) VALUES ('$name') ON CONFLICT DO NOTHING;"
          done
      - name: Apply extracted production schema
        run: |
          # The pot receipt table and its guard belong to the platform
          # migration that declares them, not to the catalog extract.
          for f in scripts/dev/farm-bank-schema-extract.sql; do
            echo "== $f"
            psql -h 127.0.0.1 -U postgres -d farm_v2_test -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Apply migrations
        run: |
          for f in $(ls lib/db/migrations/*.sql | sort); do
            case "$f" in
              *0004_farm_v2_local_coin_bank.sql)
                # The extracted production schema already creates this bank.
                echo "skip $f"; continue ;;
            esac
            echo "== $f"
            psql -h 127.0.0.1 -U postgres -d farm_v2_test -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Apply extracted security policies
        shell: bash
        run: |
          set -euo pipefail
          F=scripts/dev/core-schema-security-extract.sql
          OUT=/tmp/drop-objects.sql
          python3 - "$F" "$OUT" <<'PYEOF'
          import re, sys
          src, out = sys.argv[1], sys.argv[2]
          sql = open(src, encoding="utf-8").read()
          stmts = []
          for name, table in re.findall(r"CREATE\s+POLICY\s+(\w+)\s+ON\s+([\w.]+)", sql, re.I):
              stmts.append(f"DROP POLICY IF EXISTS {name} ON {table};")
          for name, table in re.findall(r"CREATE\s+TRIGGER\s+(\w+)[^;]*?\sON\s+([\w.]+)", sql, re.I):
              stmts.append(f"DROP TRIGGER IF EXISTS {name} ON {table};")
          for name in re.findall(r"CREATE\s+(?:UNIQUE\s+)?INDEX\s+(\w+)", sql, re.I):
              stmts.append(f"DROP INDEX IF EXISTS {name};")
          for table, name in re.findall(r"ALTER\s+TABLE\s+([\w.]+)\s+ADD\s+CONSTRAINT\s+(\w+)", sql, re.I):
              stmts.append(f"ALTER TABLE {table} DROP CONSTRAINT IF EXISTS {name};")
          if not stmts:
              sys.exit("no objects parsed from the security extract")
          open(out, "w", encoding="utf-8").write("\n".join(stmts) + "\n")
          print(f"--- generated {len(stmts)} statements")
          PYEOF
          cat "$OUT"
          psql -h 127.0.0.1 -U postgres -d farm_v2_test -v ON_ERROR_STOP=1 -q -f "$OUT"
          psql -h 127.0.0.1 -U postgres -d farm_v2_test -v ON_ERROR_STOP=1 -q -f "$F"
      - name: Yield the core wallet policies to the platform migrations
        run: |
          # The suite applies the platform wallet migrations itself, and those
          # declare these two policies. They are the production source for these
          # tables, so the extract's copies step aside here. Every other policy
          # from the extract stays in force.
          psql -h 127.0.0.1 -U postgres -d farm_v2_test -v ON_ERROR_STOP=1 -q <<'SQL'
          DROP POLICY IF EXISTS core_wallets_owner_select ON public.core_wallets;
          DROP POLICY IF EXISTS core_wallet_ledger_owner_select ON public.core_wallet_ledger;
          SQL
      - name: Record what the harness applied
        run: |
          psql -h 127.0.0.1 -U postgres -d farm_v2_test -v ON_ERROR_STOP=1 -q <<'SQL'
          INSERT INTO public._harness_applied(file) VALUES
            ('0001_create_core_schema.sql'),('0002_enable_required_extensions.sql'),
            ('0003_create_core_identity_tables.sql'),('0004_create_core_subject_tables.sql'),
            ('0005_create_core_consent_tables.sql'),('0006_create_core_wallet_tables.sql'),
            ('0007_create_core_journey_tables.sql'),('0008_create_updated_at_triggers.sql'),
            ('0009_enforce_wallet_ledger_immutability.sql'),('0010_create_core_rls_policies.sql'),
            ('0019_create_core_wallet_runtime.sql'),('0132_farm_v2_atomic_pot_settlement.sql'),
            ('farm-bank-schema-extract.sql'),('core-schema-security-extract.sql'),
            ('0001_farm_v2_authority_reconciliation.sql'),
            ('0002_farm_v2_local_coin_bank.sql'),('0003_farm_v2_bank_bridge.sql')
          ON CONFLICT DO NOTHING;
          SQL
      - name: Apply the crop reward label last
        run: |
          psql -h 127.0.0.1 -U postgres -d farm_v2_test -v ON_ERROR_STOP=1 -q \
            -f artifacts/api-server/scripts/dev/platform-fixtures/supabase/migrations/0137_farm_v2_crop_reward_label.sql
      - name: Probe the crop reward label in the isolated database
        run: |
          psql -h 127.0.0.1 -U postgres -d farm_v2_test -v ON_ERROR_STOP=1 <<'SQL'
          do $probe$
          declare
            v_def text;
            v_status text;
            v_owner uuid := '00000000-0000-4000-8000-0000000000aa';
          begin
            -- 1. the three functions actually loaded carry the new label
            raise notice 'BRIDGE_LABEL %', position('farm_crop_reward' in pg_get_functiondef('public.farm_v2_apply_wallet_transaction(uuid,text,integer,text,text,text,text,text,uuid)'::regprocedure));
            raise notice 'RECON_LABEL %', position('farm_crop_reward' in pg_get_functiondef('public.farm_v2_operator_wallet_reconcile(uuid,text,text,text,text,text)'::regprocedure));
            raise notice 'GUARD_LABEL %', position('farm_crop_reward' in pg_get_functiondef('public.farm_v2_closed_wallet_request_guard()'::regprocedure));
            raise notice 'PROSRC %', (select count(*) from pg_proc where proname='farm_v2_apply_wallet_transaction' and prosrc like '%farm_crop_reward%');
            if position('farm_crop_reward' in pg_get_functiondef('public.farm_v2_apply_wallet_transaction(uuid,text,integer,text,text,text,text,text,uuid)'::regprocedure)) = 0 then
              raise exception 'PROBE_MISSING_LABEL bridge';
            end if;
            if position('farm_crop_reward' in pg_get_functiondef('public.farm_v2_operator_wallet_reconcile(uuid,text,text,text,text,text)'::regprocedure)) = 0 then
              raise exception 'PROBE_MISSING_LABEL reconcile';
            end if;
            if position('farm_crop_reward' in pg_get_functiondef('public.farm_v2_closed_wallet_request_guard()'::regprocedure)) = 0 then
              raise exception 'PROBE_MISSING_LABEL guard';
            end if;
            -- 2. the crystal guard trigger is still installed
            if not exists (select 1 from pg_trigger where tgname like '%crystal_policy%' and not tgisinternal) then
              raise exception 'PROBE_GUARD_MISSING';
            end if;
            -- 3. forged reference id is refused
            select result->>'result_status' into v_status from (select public.farm_v2_apply_wallet_transaction(
              v_owner,'probe-forged',20,'crystal','credit','farm_crop_reward','9:20','farm_crop_reward',null) as result) t;
            if v_status <> 'invalid' then raise exception 'PROBE_FORGED_REFERENCE %', v_status; end if;
            -- 4. forged amount is refused
            select result->>'result_status' into v_status from (select public.farm_v2_apply_wallet_transaction(
              v_owner,'probe-amount',999,'crystal','credit','farm_crop_reward','6:20','farm_crop_reward',null) as result) t;
            if v_status <> 'invalid' then raise exception 'PROBE_FORGED_AMOUNT %', v_status; end if;
            -- 5. wrong currency for the land is refused
            select result->>'result_status' into v_status from (select public.farm_v2_apply_wallet_transaction(
              v_owner,'probe-currency',20,'coin','credit','farm_crop_reward','6:20','farm_crop_reward',null) as result) t;
            if v_status <> 'invalid' then raise exception 'PROBE_WRONG_CURRENCY %', v_status; end if;
            -- 6. the reward label cannot borrow a different reference type
            select result->>'result_status' into v_status from (select public.farm_v2_apply_wallet_transaction(
              v_owner,'probe-type',20,'crystal','credit','farm_crop_reward','6:20','farm_seed_pack',null) as result) t;
            if v_status <> 'invalid' then raise exception 'PROBE_LABEL_BORROWED %', v_status; end if;
            -- 7. debit is refused for a crop reward
            select result->>'result_status' into v_status from (select public.farm_v2_apply_wallet_transaction(
              v_owner,'probe-debit',20,'crystal','debit','farm_crop_reward','6:20','farm_crop_reward',null) as result) t;
            if v_status <> 'invalid' then raise exception 'PROBE_DEBIT %', v_status; end if;
            -- 8. the historical label still validates for the same plan; reaching
            -- core (any later error) proves the label itself was accepted
            begin
              select result->>'result_status' into v_status from (select public.farm_v2_apply_wallet_transaction(
                v_owner,'probe-legacy',20,'crystal','credit','farm_crop_exchange','6:20','farm_crop_exchange',null) as result) t;
            exception when others then v_status := 'reached_core';
            end;
            if v_status = 'invalid' then raise exception 'PROBE_LEGACY_LABEL_REJECTED'; end if;
            -- 9. a seed purchase still validates (label unrelated to the reward)
            begin
              select result->>'result_status' into v_status from (select public.farm_v2_apply_wallet_transaction(
                v_owner,'probe-seed',3,'coin','debit','farm_seed_purchase','1:3','farm_seed_pack',null) as result) t;
            exception when others then v_status := 'reached_core';
            end;
            if v_status = 'invalid' then raise exception 'PROBE_SEED_REJECTED'; end if;
            raise notice 'PROBE_OK';
          end
          $probe$;
          SQL
      - name: Integration tests
        run: pnpm --filter @workspace/api-server exec vitest run src/lib --reporter=verbose
