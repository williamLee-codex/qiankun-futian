name: Farm V2 integration
on:
  workflow_dispatch: {}
  push:
    branches:
      - "integrate/farm-v2-firstpurchase-signin-20261122"
      - "release/farm-v2-tsc-20261124"
    paths:
      - "artifacts/api-server/src/lib/**"
      - "lib/db/migrations/**"
      - ".github/workflows/farm-v2-integration.yml"
  pull_request:
    paths:
      - "artifacts/api-server/src/lib/**"
      - "lib/db/migrations/**"
      - ".github/workflows/farm-v2-integration.yml"
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: farm-v2-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:farm-v2-test@127.0.0.1:5432/farm_v2_test
      PGPASSWORD: farm-v2-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare Supabase-compatible database
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE farm_v2_test"
          psql -h 127.0.0.1 -U postgres -d farm_v2_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY, email text);
          DO $$ BEGIN CREATE ROLE anon NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE authenticated NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE service_role NOLOGIN BYPASSRLS; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE farm_v2_runtime NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          -- Core wallet tables live in the platform repo; farm migrations
          -- reference them, so the isolated database needs the same shape.
          CREATE TABLE IF NOT EXISTS public.core_wallets (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            owner_id uuid NOT NULL UNIQUE,
            coin_balance integer NOT NULL DEFAULT 0,
            crystal_balance integer NOT NULL DEFAULT 0,
            destiny_ticket_balance integer NOT NULL DEFAULT 0,
            status text NOT NULL DEFAULT 'active',
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE TABLE IF NOT EXISTS public.core_wallet_ledger (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            wallet_id uuid REFERENCES public.core_wallets(id),
            owner_id uuid NOT NULL,
            operation_id uuid,
            amount integer NOT NULL DEFAULT 0,
            currency text NOT NULL DEFAULT 'coin',
            direction text NOT NULL DEFAULT 'credit',
            reason text,
            reference_id text,
            reference_type text,
            idempotency_key text,
            created_at timestamptz NOT NULL DEFAULT now()
          );
          SQL
      - name: Apply migrations
        run: |
          for f in $(ls lib/db/migrations/*.sql | sort); do
            echo "== $f"
            psql -h 127.0.0.1 -U postgres -d farm_v2_test -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Integration tests
        run: pnpm --filter @workspace/api-server exec vitest run src/lib --reporter=verbose
